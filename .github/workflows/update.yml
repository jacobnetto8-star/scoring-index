name: Daily stats refresh

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 6:17 am Toronto in summer, 5:17 am in winter
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/**"]   # redeploy when the page itself is edited

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      failed: ${{ steps.scrape.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull today's stats
        id: scrape
        run: python scripts/scrape.py || echo "failed=1" >> "$GITHUB_OUTPUT"
      - name: Commit updated data
        run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily stats refresh $(date -u +%F)"
          git push

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  flag-stale:
    # Fails the run (so GitHub emails you) when a league kept yesterday's data.
    needs: [update, deploy]
    if: always() && needs.update.outputs.failed == '1'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::At least one league could not be refreshed and is showing its previous data. See the 'update' job summary."
          exit 1
